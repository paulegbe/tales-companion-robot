[develop]
script_dir=$base/lib/companion_brain
[install]
install_scripts=$base/lib/companion_brain
[tool:pytest]
# The Jetson's apt pytest is 6.2.5. anthropic pulls in anyio, whose pytest
# plugin imports _pytest.scope (pytest 7+) and crashes pytest at startup.
# colcon test does not pass PYTEST_ADDOPTS through, so disable it here.
addopts = -p no:anyio
